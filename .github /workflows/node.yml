name: Ecosystem Explorer

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 */4 * * *"

permissions:
  contents: write

jobs:
  run-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run kernel
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python kernel.py

      - name: Save state
        run: |
          git config user.name "ecosystem-explorer"
          git config user.email "ecosystem-explorer@users.noreply.github.com"
          git add synapses/state.json outputs/synapse_forward.json memory/events.jsonl
          git diff --cached --quiet || (
            git commit -m "Record node state [skip ci]"
            git push
          )
